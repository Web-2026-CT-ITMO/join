name: Получить репозиторий для проекта
description: Создаёт для вас приватный репозиторий в организации курса
title: "Заявка на репозиторий"
labels: ["repo-request"]
body:
  - type: markdown
    attributes:
      value: |
        Заполните поле и нажмите **Create** / **Submit new issue**.
        Через минуту здесь появится комментарий со ссылкой на ваш репозиторий,
        а на почту придёт приглашение — его нужно **принять**.
  - type: input
    id: student
    attributes:
      label: ФИО и группа
      placeholder: Иванов Иван, M3439
    validations:
      required: true
